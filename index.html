<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI-UX</title>
    <link rel="stylesheet" href="css/navBar.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <nav>
        <div class="logo-wrapper">
            <img src="img/logo1.png" alt="logo">
            <h1>Travel Away</h1>
        </div>
        <ul>
            <li>Home</li>
            <li>Category</li>
            <li>Blog</li>
            <li>About Us</li>
        </ul>

        <div class="user-account">
            <button class="btn-item">login</button>
            <button class="btn-color">Sing Up</button>
        </div>
    </nav>

    <main>
        <div class="hero-text">
            <div class="main-text">
                <h1>The whole <br> <span>world</span> in <br> one app!</h1>
                <p>
                   <b> Looking for where to book cheap and safe flights?
                   <br> Travel away is the one stop for you.</b>
                </p>
            </div>
          
            <div class="btn-man">
                <p>
                    Traveling around the world has become easier with the app!
                </p>
                
                <div class="btn-app">
                   <button>
                    <img src="img/play.svg" alt="">
                    <P>Download from <b>Playstore</b></P>
                   </button> 
                 
                   <button>
                    <img src="img/app.svg" alt="">
                    <P>Download from <b>Applestore</b></P>
                   </button>
                
                </div>
            </div>
        </div>
      
        <div class="hero-img">
            <img src="img/1.png" alt="Pessoa">
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
